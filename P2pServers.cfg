# xnat_p2p 风格 P2P 服务器配置
# 格式：NatServer<序号>=IP     NAT 汇聚/打洞服务端（可多台，逗号不限）
#       Proxy<序号>_<子序号>=IP 中继代理（可多个）
# 支持 ip 或 ip:port 写法；# 开头为注释
#
# 可选键（生产启用时取消注释）：
#   EnableAuth=1                强制鉴权（客户端必须带 -s 密钥）
#   AuthSecret=s3cr3t           HMAC-SHA256 密钥；开启后心跳走流加密通道
#   EnableLicense=1             启用 UUID 白名单门控
#   AllowedUuids=aaaa,bbbb      白名单 UUID（逗号分隔）
#   或 WhitelistUuids=aaaa,bbbb （写即启用白名单，等价 EnableLicense+AllowedUuids）
#   ProcWorkers=4               业务处理线程数
#   RecvThreads=2               UDP 收包线程数（SO_REUSEPORT，>=1）
#   FloodPktThreshold=200       防洪水阈值（pps）
#   BlacklistSeconds=60         IP 拉黑时长（秒）
#   EnableConnectToken=1        CONNECT 必须出示连线 Token（需 AuthSecret）
#   Region=C                    本节点区域（P6 就近调度）
#   NatRegions=1.2.3.4:C,5.6.7.8:A
#   ProxyRegions=1.2.3.4:C
#   InstanceName=nat-local         实例名（状态 JSON / metrics）
#   StatusPort=16010               HTTP 状态口（0=关；也可 P2P_STATUS_PORT）
#   StatusAllow=127.0.0.1,10.0.0.0/8  状态口来源白名单（空=不限制）
# 覆盖顺序：文件 < P2P_* 环境变量 < 命令行。值支持 ${ENV}；P2P_DISABLE_ENV_PARSING=1 只关展开。

NatServer1=127.0.0.1
Proxy1_1=127.0.0.1
